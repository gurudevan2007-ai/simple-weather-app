<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Weather Application</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🌤 Simple Weather Application</h1>

        <input
            type="text"
            placeholder="Enter City Name">

        <button>Search</button>

        <div class="weather">

            <h2>Weather Details</h2>

            <p>🌡 Temperature : -- °C</p>

            <p>💧 Humidity : -- %</p>

            <p>🌬 Wind Speed : -- km/h</p>

            <p>☁ Condition : --</p>

        </div>

        <div class="suggestion">

            <h2>Suggestions</h2>

            <p>Weather suggestions will appear here.</p>

        </div>

    </div>

</body>

</html>
